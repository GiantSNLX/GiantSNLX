<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 176" width="100%" role="img" aria-label="Yuri Tanaka — Tanaka.rar">
  <defs>
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1924"/>
      <stop offset="65%" stop-color="#102a3b"/>
      <stop offset="100%" stop-color="#143f54"/>
    </linearGradient>
    <linearGradient id="accent-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7cd4e6"/>
      <stop offset="100%" stop-color="#7cd4e6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="win-clip-dark">
      <rect x="1" y="1" width="878" height="174" rx="11.5"/>
    </clipPath>
  </defs>
  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .mark-path {
      fill: #eaf8ff;
      fill-opacity: 0;
      stroke: #7cd4e6;
      stroke-width: 14;
      stroke-linejoin: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: draw-stroke 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                 fill-in 0.55s ease 0.55s forwards;
    }
    .mark-t {
      animation-delay: 0.15s, 0.65s;
    }
    .line-reveal {
      transform-box: fill-box;
      transform-origin: left center;
      transform: scaleX(0);
      animation: expand-x 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.45s forwards;
    }
    .cursor {
      animation: blink 1.15s step-end infinite;
    }
    @keyframes draw-stroke {
      to { stroke-dashoffset: 0; }
    }
    @keyframes fill-in {
      to { fill-opacity: 1; stroke-opacity: 0.25; }
    }
    @keyframes expand-x {
      to { transform: scaleX(1); }
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mark-path { animation: none; stroke-dashoffset: 0; fill-opacity: 1; stroke-opacity: 0.25; }
      .line-reveal { animation: none; transform: scaleX(1); }
      .cursor { animation: none; }
    }
  </style>

  <!-- Janela CMD com paleta slate/teal do perfil -->
  <rect x="0.5" y="0.5" width="879" height="175" rx="12" fill="url(#bg-dark)" stroke="#23485c"/>

  <g clip-path="url(#win-clip-dark)">
    <!-- Marca d'água YT grande e centralizada verticalmente na direita -->
    <g transform="translate(612 -17) scale(0.39) translate(-104 -126)" opacity="0.065" fill="#8cdeed">
      <path d="M104 146 Q104 126 125 126 H299 Q326 126 343 150 L429 279 Q439 292 449 279 L548 149 Q566 126 591 126 H939 Q965 126 965 152 V237 Q965 264 939 264 H687 Q671 264 661 279 L525 445 Q502 476 502 507 V739 Q502 766 475 766 H362 Q334 766 334 738 V511 Q334 485 319 463 L110 161 Q104 153 104 146 Z"/>
      <path d="M798 293 V722 Q798 766 752 766 H583 V510 Q583 481 600 456 L678 330 Q706 293 744 293 Z"/>
    </g>

    <!-- Barra da janela CMD -->
    <rect x="0" y="0" width="880" height="40" fill="#09151f"/>
    <line x1="0" y1="40" x2="880" y2="40" stroke="#1d3c4d"/>
    <circle cx="22" cy="20" r="5" fill="#ff7b72"/>
    <circle cx="39" cy="20" r="5" fill="#e3b341"/>
    <circle cx="56" cy="20" r="5" fill="#5eead4"/>
    <text x="76" y="24" fill="#82a0b0" font-size="11.5" class="mono">~/GiantSNLX</text>
  </g>

  <!-- Monograma YT animado -->
  <g transform="translate(36 74) scale(0.10625) translate(-104 -126)">
    <path d="M104 146 Q104 126 125 126 H299 Q326 126 343 150 L429 279 Q439 292 449 279 L548 149 Q566 126 591 126 H939 Q965 126 965 152 V237 Q965 264 939 264 H687 Q671 264 661 279 L525 445 Q502 476 502 507 V739 Q502 766 475 766 H362 Q334 766 334 738 V511 Q334 485 319 463 L110 161 Q104 153 104 146 Z" pathLength="100" class="mark-path"/>
    <path d="M798 293 V722 Q798 766 752 766 H583 V510 Q583 481 600 456 L678 330 Q706 293 744 293 Z" pathLength="100" class="mark-path mark-t"/>
  </g>

  <!-- Prompt CMD + Nome em sans limpa + linha de destaque -->
  <text x="159" y="84" font-size="13" letter-spacing="0.8" class="mono">
    <tspan fill="#5eead4">&gt;</tspan> <tspan fill="#85d6e5">Tanaka.rar</tspan><tspan dx="2" fill="#5eead4" class="cursor">_</tspan>
  </text>
  <text x="159" y="121" fill="#f0f9ff" font-size="34" font-weight="700" letter-spacing="-0.5" class="sans">Yuri Tanaka</text>
  <rect x="159" y="134" width="185" height="2" rx="1" fill="url(#accent-dark)" class="line-reveal"/>
</svg>

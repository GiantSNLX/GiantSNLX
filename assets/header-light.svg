<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 148" width="100%" role="img" aria-label="Yuri Tanaka — Tanaka.rar">
  <defs>
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f9fb"/>
      <stop offset="65%" stop-color="#edf4f8"/>
      <stop offset="100%" stop-color="#e1eef4"/>
    </linearGradient>
    <linearGradient id="accent-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f5f7a"/>
      <stop offset="100%" stop-color="#0f5f7a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .mark-path {
      fill: #0d2a3a;
      fill-opacity: 0;
      stroke: #0f5f7a;
      stroke-width: 14;
      stroke-linejoin: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: draw-stroke 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                 fill-in 0.55s ease 0.55s forwards;
    }
    .mark-t {
      animation-delay: 0.15s, 0.65s;
    }
    .line-reveal {
      transform-box: fill-box;
      transform-origin: left center;
      transform: scaleX(0);
      animation: expand-x 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.45s forwards;
    }
    .pulse {
      animation: blink 1.8s ease-in-out infinite;
    }
    @keyframes draw-stroke {
      to { stroke-dashoffset: 0; }
    }
    @keyframes fill-in {
      to { fill-opacity: 1; stroke-opacity: 0.25; }
    }
    @keyframes expand-x {
      to { transform: scaleX(1); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mark-path { animation: none; stroke-dashoffset: 0; fill-opacity: 1; stroke-opacity: 0.25; }
      .line-reveal { animation: none; transform: scaleX(1); }
      .pulse { animation: none; }
    }
  </style>

  <rect x="0.5" y="0.5" width="879" height="147" rx="10" fill="url(#bg-light)" stroke="#cbd9e2"/>

  <g transform="translate(705 16) scale(0.18) translate(-104 -126)" opacity="0.06" fill="#0d2a3a">
    <path d="M104 146 Q104 126 125 126 H299 Q326 126 343 150 L429 279 Q439 292 449 279 L548 149 Q566 126 591 126 H939 Q965 126 965 152 V237 Q965 264 939 264 H687 Q671 264 661 279 L525 445 Q502 476 502 507 V739 Q502 766 475 766 H362 Q334 766 334 738 V511 Q334 485 319 463 L110 161 Q104 153 104 146 Z"/>
    <path d="M798 293 V722 Q798 766 752 766 H583 V510 Q583 481 600 456 L678 330 Q706 293 744 293 Z"/>
  </g>

  <g transform="translate(36 40) scale(0.10625) translate(-104 -126)">
    <path d="M104 146 Q104 126 125 126 H299 Q326 126 343 150 L429 279 Q439 292 449 279 L548 149 Q566 126 591 126 H939 Q965 126 965 152 V237 Q965 264 939 264 H687 Q671 264 661 279 L525 445 Q502 476 502 507 V739 Q502 766 475 766 H362 Q334 766 334 738 V511 Q334 485 319 463 L110 161 Q104 153 104 146 Z" pathLength="100" class="mark-path"/>
    <path d="M798 293 V722 Q798 766 752 766 H583 V510 Q583 481 600 456 L678 330 Q706 293 744 293 Z" pathLength="100" class="mark-path mark-t"/>
  </g>

  <circle cx="163" cy="54" r="3.5" fill="#0f766e" class="pulse"/>
  <text x="174" y="58" fill="#0f5f7a" font-size="12" letter-spacing="1.2" class="mono">Tanaka.rar</text>
  <text x="159" y="92" fill="#0d2a3a" font-size="30" font-weight="700" letter-spacing="-0.4" class="sans">Yuri Tanaka</text>
  <rect x="159" y="105" width="170" height="2" rx="1" fill="url(#accent-light)" class="line-reveal"/>
</svg>

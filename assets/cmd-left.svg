<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 236" width="100%" role="img" aria-label="Yuri Tanaka — Blog tanakarar.com.br">
  <defs>
    <linearGradient id="bg-l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b1924"/>
      <stop offset="100%" stop-color="#102a3b"/>
    </linearGradient>
    <linearGradient id="bg-l-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6f9fb"/>
      <stop offset="100%" stop-color="#edf4f8"/>
    </linearGradient>
    <linearGradient id="accent-l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7cd4e6"/>
      <stop offset="100%" stop-color="#7cd4e6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip-l">
      <path d="M12,1 H440 V235 H12 A11,11 0 0 1 1,224 V12 A11,11 0 0 1 12,1 Z"/>
    </clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg-shape { fill: url(#bg-l); }
    .win-border { stroke: #23485c; }
    .bar-bg { fill: #09151f; }
    .bar-line { stroke: #1d3c4d; }
    .bar-title { fill: #82a0b0; }
    .prompt-arrow { fill: #5eead4; }
    .prompt-text { fill: #85d6e5; }
    .title { fill: #f0f9ff; }
    .body-text { fill: #c7dae3; }
    .batman { fill: #7cd4e6; }
    .hint { fill: #85d6e5; }
    .mark-path {
      fill: #eaf8ff;
      fill-opacity: 0;
      stroke: #7cd4e6;
      stroke-width: 14;
      stroke-linejoin: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: draw-stroke 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                 fill-in 0.55s ease 0.55s forwards;
    }
    .mark-t { animation-delay: 0.15s, 0.65s; }
    .line-reveal {
      transform-box: fill-box;
      transform-origin: left center;
      transform: scaleX(0);
      animation: expand-x 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.45s forwards;
    }
    .cursor { animation: blink 1.15s step-end infinite; }
    @keyframes draw-stroke { to { stroke-dashoffset: 0; } }
    @keyframes fill-in { to { fill-opacity: 1; stroke-opacity: 0.25; } }
    @keyframes expand-x { to { transform: scaleX(1); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-color-scheme: light) {
      .bg-shape { fill: url(#bg-l-light); }
      .win-border { stroke: #cbd9e2; }
      .bar-bg { fill: #eef3f7; }
      .bar-line { stroke: #d5e1e8; }
      .bar-title { fill: #596c78; }
      .prompt-arrow { fill: #0f766e; }
      .prompt-text { fill: #0f5f7a; }
      .title { fill: #0d2a3a; }
      .body-text { fill: #2f4854; }
      .batman { fill: #0f5f7a; }
      .hint { fill: #0f5f7a; }
      .mark-path { fill: #0d2a3a; stroke: #0f5f7a; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mark-path { animation: none; stroke-dashoffset: 0; fill-opacity: 1; stroke-opacity: 0.25; }
      .line-reveal { animation: none; transform: scaleX(1); }
      .cursor { animation: none; }
    }
  </style>

  <path d="M12,0.5 H440 V235.5 H12 A11.5,11.5 0 0 1 0.5,224 V12 A11.5,11.5 0 0 1 12,0.5 Z" class="bg-shape"/>

  <g clip-path="url(#clip-l)">
    <rect x="0" y="0" width="440" height="40" class="bar-bg"/>
    <line x1="0" y1="40" x2="440" y2="40" class="bar-line"/>
    <circle cx="22" cy="20" r="5" fill="#ff7b72"/>
    <circle cx="39" cy="20" r="5" fill="#e3b341"/>
    <circle cx="56" cy="20" r="5" fill="#5eead4"/>
    <text x="76" y="24" font-size="11.5" class="mono bar-title">~/GiantSNLX</text>
  </g>

  <path d="M440,0.5 H12 A11.5,11.5 0 0 0 0.5,12 V224 A11.5,11.5 0 0 0 12,235.5 H440" fill="none" class="win-border"/>
  <line x1="439.5" y1="48" x2="439.5" y2="227" stroke="#23485c" stroke-opacity="0.35" stroke-dasharray="3 4"/>

  <!-- Monograma YT animado -->
  <g transform="translate(28 56) scale(0.084375) translate(-104 -126)">
    <path d="M104 146 Q104 126 125 126 H299 Q326 126 343 150 L429 279 Q439 292 449 279 L548 149 Q566 126 591 126 H939 Q965 126 965 152 V237 Q965 264 939 264 H687 Q671 264 661 279 L525 445 Q502 476 502 507 V739 Q502 766 475 766 H362 Q334 766 334 738 V511 Q334 485 319 463 L110 161 Q104 153 104 146 Z" pathLength="100" class="mark-path"/>
    <path d="M798 293 V722 Q798 766 752 766 H583 V510 Q583 481 600 456 L678 330 Q706 293 744 293 Z" pathLength="100" class="mark-path mark-t"/>
  </g>

  <!-- Cabeçalho -->
  <text x="116" y="72" font-size="12" letter-spacing="0.6" class="mono">
    <tspan class="prompt-arrow">&gt;</tspan> <tspan class="prompt-text">Tanaka.rar</tspan><tspan dx="2" class="prompt-arrow cursor">_</tspan>
  </text>
  <text x="116" y="102" font-size="26" font-weight="700" letter-spacing="-0.4" class="sans title">Yuri Tanaka</text>
  <rect x="116" y="111" width="145" height="2" rx="1" fill="url(#accent-l)" class="line-reveal"/>

  <!-- Texto completo na metade esquerda -->
  <text x="28" y="140" font-size="13" class="sans body-text">Durante o dia automatizando processos fiscais,</text>
  <text x="28" y="159" font-size="13" class="sans body-text">construindo coisas na web e testando até onde dá</text>
  <text x="28" y="178" font-size="13" class="sans body-text">pra ir com IA sem desligar o cérebro.</text>
  <text x="28" y="198" font-size="13" font-weight="600" class="sans batman">De noite eu sou o Batman.</text>

  <!-- Gancho clicável pro blog -->
  <text x="28" y="222" font-size="11" class="mono">
    <tspan class="prompt-arrow">&gt;</tspan> <tspan class="hint">não acesse meu blog ↗</tspan>
  </text>
</svg>
